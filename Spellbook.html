<html lang="en">
<head>
<meta charset="utf-8">
<title>Spellbook</title>
<link rel="stylesheet" href="./css/style.css" />
<style>
td, th{
  text-align: center;
  
}

td:last-child{
  min-width: 120px;
}
.prime{
  position: sticky;
  z-index: 3;
  top: 75px;
  border: 1px solid black;
  border-collapse: collapse;
}

</style>
<script src="./js/data.js" lang="javascript"></script>
<script>
header = ["name", "cost", "bonus", "elem", "weight", "range", "time", "effect", "user"];

function elem_option_list(){
	let html = "<br><form name='elemForm'><select id='select_elem' name='elems' multiple size='1'>";
	
	let el_set = new Set();
	for (var p of spells){
		if (Object.keys(p).includes("elem")){
			el_set = el_set.union(new Set(p.elem))
		}
	}
	
	let i = 1;
	html +="<optgroup label='Types'>";
	while (i<4){
		if (el_set.has(i)){
			html += "<option value=" + i + ">" + basic_elements[i]+ "</option>";
		}
		i += 1;
	}
	html += "</optgroup>";
	
	i = 7
	html +="<optgroup label='Subtypes'>";
	while (i< basic_elements.length){
		if (el_set.has(i)){
			html += "<option value=" + i + ">" + basic_elements[i] + "</option>";
		}
		i += 1;
	}
	html += "</optgroup>";
	
	html += "</select></form>"
	return html;
}

function user_option_list(){
	let html = "<br><form name='userForm'><select id='select_user' name='users' multiple size='1'>";
	let us_set = new Set();
	for (var p of spells){
		if (Object.keys(p).includes("user")){
			us_set = us_set.union(new Set(p.user))
		}
	}
	html +="<optgroup label='Characters'>";
	for (var us of creatures){
		if ((us.type == "Characters")&(us_set.has(us.name))){
			html += "<option value='" + us.name + "'>" + us.name + "</option>";
		}
	}
	html += "</optgroup>";
	
	html +="<optgroup label='Villains'>";
	for (var us of creatures){
		if ((us.type == "Villain")&(us_set.has(us.name))){
			html += "<option value='" + us.name + "'>" + us.name + "</option>";
		}
	}
	html += "</optgroup>";
	
	
	html += "</select></form>"
	return html;
}

function weight_buttons(){
	let html = "<form name='weightForm'><input type='button' id='w_button' value='▼' /></form>";
	return html;
}

function name_buttons(){
	let html = "<form name='nameForm'><input type='button' id='n_button' value='■' /></form>";
	return html;
}
</script>
</head>
<body>


<div>
<header>
<table><thead>
<tr><th id="menu_1">Rules</th><th id="menu_2">Dungeon</th><th id="menu_3">World</th></tr>
</thead></table>
</header>

<h1>Spellbook</h1>

<main>
<div>
<table>
<thead class="prime">
<tr><th>Spell Name<script>document.write(name_buttons())</script></th>	
	<th>Cost</th>
	<th>Bonus</th>
	<th>Type<script>document.write(elem_option_list())</script></th>
	<th>Metaphysical Weight<script>document.write(weight_buttons())</script></th>
	<th>Range</th>
	<th>Duration</th>
	<th>Effect</th>
	<th>User<script>document.write(user_option_list())</script></th>
</tr>
</thead>
<tbody>
</tbody>
</table>

</div>
</main>
</div>

<script src="./js/main.js" lang="javascript"></script>
<script>
const search = {};
search["elems"] = document.elemForm.elems;
search["users"] = document.userForm.users;
search["weight"] = document.getElementById("w_button");
search["name"] = document.getElementById("n_button");

cur_search = {"elems": [], "users": [], "sort": "+weight"}
const root = document.querySelector("tbody");

tableCreation();
function update_nButton() {
	if (search["name"].value === "▼"){
		search["name"].value = "▲";
		search["weight"].value = "■";
		cur_search["sort"] = "-name";
	}else{
		search["name"].value = "▼";
		search["weight"].value = "■";
		cur_search["sort"] = "+name";
	}
	
	tableCreation();
}

function update_wButton() {
	if (search["weight"].value === "▼") {
		search["weight"].value = "▲";
		search["name"].value = "■";
		cur_search["sort"] = "-weight";
	} else	{
		search["weight"].value = "▼";
		search["name"].value = "■";
		cur_search["sort"] = "+weight";
	}
	
	tableCreation();
}

function changeOption_el(){
	const options = search["elems"].selectedOptions;
	
	let optionList = [];
	if (options.length != 0){
		for (let i = 0; i < options.length; i++) {      // for each option ...    
			optionList.push(parseInt(options[i].value));
		}
		cur_search["elems"] = optionList;
	}
	tableCreation();
}

function changeOption_us(){
	const options = search["users"].selectedOptions;
	
	let optionList = [];
	if (options.length != 0){
		for (let i = 0; i < options.length; i++) {      // for each option ...    
			optionList.push(options[i].value);
		}
		cur_search["users"] = optionList;
	}
	tableCreation();
}

function tableCreation(){
    // удаляем ранее выбранные элементы
    while (root.firstChild) { 
        root.removeChild(root.firstChild);  
    }
	let page = spells;
	page = filtering_by_param(page, "elem", cur_search["elems"], 2);
    page = filtering_by_param(page, "user", cur_search["users"], 2);
	
	page = sorting_by_param(page, cur_search["sort"].slice(1), cur_search["sort"][0] == "-");
	
	for (var p of page){
		let tr = document.createElement("tr");
		for (var h of header){
			let td = document.createElement("td");
			let text = '';
			
			if (h == 'name'){
				text += p.name;
				if (Object.keys(p).includes("aff")){
					text += " - <span class='element'>" + p.aff + "</span> Affinity";
				}
				if (Object.keys(p).includes("over")){
					if (p.over){
						text += " (Overcast: " + p.over + ")";
					}else{
						text += " (Overcast)";
					}
				}
			}
			else if ((h == 'cost') & (Object.keys(p).includes("cost"))){
				if (["MP", "MW", "HP"].includes(p.cost.split(" ")[1])){
					if (p.cost.slice(-2) == "HP"){
						text += translate_hp(p.cost.slice(0, -3), 2);
					}else{
						text += "<span class='stat'>" + p.cost + "</span>";
					}
				}else{
					text += p.cost;
				}
			}
			else if ((h == 'bonus') & (Object.keys(p).includes("bonus"))){
				if (["MRT", "DPL", "STW", "ING", "LRN", "SRT", "CBT", "OCBT", "DCBT"].includes(p.bonus.split(" ")[1])){
					text += "<span class='stat'>" + p.bonus + "</span>";
				}else{
					text += p.bonus;
				}
			}
			else if ((h == "elem") & (Object.keys(p).includes("elem"))){
				text += "<span class='element'>"
				if (p.elem.length > 0){
					if (cur_search["elems"].includes(p.elem[0])){
						text += "<span style='background-color:yellow' class='element'>" + basic_elements[p.elem[0]] + "</span>";
					}else{
						text += "<span class='element'>" + basic_elements[p.elem[0]] + "</span>";
					}
				}
				if (p.elem.length > 1){
					text += " (";
					if (cur_search["elems"].includes(p.elem[1])){
						text += "<span style='background-color:yellow' class='element'>" + basic_elements[p.elem[1]] + "</span>";
					}else{
						text += "<span class='element'>" + basic_elements[p.elem[1]] + "</span>";
					}
					for (var el of p.elem.slice(2)){
						if (cur_search["elems"].includes(el)){
							text += ", <span style='background-color:yellow' class='element'>" + basic_elements[el] + "</span>";
						}else{
							text += ", <span class='element'>" + basic_elements[el] + "</span>"
						}
					}
					text += ")";
				}
				text +="</span>";
			}
			else if ((h == "weight") & (Object.keys(p).includes("weight"))){
				text += "<span class='weight'>"
				if (p.weight == "The Sun"){
					text += "<span class='sun'>" + p.weight + "</span>";
				}else if (p.weight == "Mercury"){
					text += "<span class='mercury'>" + p.weight + "</span>";
				}else if (p.weight == "Venus"){
					text += "<span class='venus'>" + p.weight + "</span>";
				}else if (p.weight == "The Moon"){
					text += "<span class='moon'>" + p.weight + "</span>";
				}else if (p.weight == "The Moon and Mars"){
					text += "<span class='moon'>The Moon</span> and <span class='mars'>Mars</span>";
				}else if (p.weight == "Mars"){
					text += "<span class='mars'>" + p.weight + "</span>";
				}else if (p.weight == "Jupiter"){
					text += "<span class='jupiter'>" + p.weight + "</span>";
				}else if (p.weight == "Saturn"){
					text += "<span class='saturn'>" + p.weight + "</span>";
				}else if (p.weight == "Soul of the Earth"){
					text += "<span class='soul'>" + p.weight + "</span>";
				}else if (p.weight == "Heart of the Earth"){
					text += "<span class='heart'>" + p.weight + "</span>";
				}else if (p.weight == "Body of the Earth"){
					text += "<span class='body'>" + p.weight + "</span>";
				}else if (p.weight == "Mind of the Earth"){
					text += "<span class='mind'>" + p.weight + "</span>";
				}else if ((p.weight == "Anubis")|(p.weight == "Altjira")|(p.weight == "Yog-Sothoth")|(p.weight == "Jehovah")){
					text += "<span class='god'>" + p.weight + "</span>";
				}else{
					text += p.weight;
				}
				text += "</span>";
			}
			else if ((h == 'range') & (Object.keys(p).includes("range"))){
				text += p.range;
			}
			else if ((h == 'time') & (Object.keys(p).includes("time"))){
				text += p.time;
			}
			else if ((h == 'effect') & (Object.keys(p).includes("effect"))){
				text += p.effect;
			}
			else if ((h == 'user') & (Object.keys(p).includes("user"))){
				text += p.user.map((us) => "<a href='Characters.html#" + us.replaceAll(" ", "_") + "' class='character'>" + us + "</a>").join("<br>");
			}
			
			tr.appendChild(td);
			td.insertAdjacentHTML('afterbegin', text);
		}
		root.appendChild(tr);
	}
	
}

search["elems"].addEventListener("change", changeOption_el);
search["users"].addEventListener("change", changeOption_us);
search["name"].addEventListener("click", update_nButton);
search["weight"].addEventListener("click", update_wButton);
</script>

</body>
</html>
